<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 162" width="880" height="162" font-family="ui-monospace,'SFMono-Regular','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace">
<defs><linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#79c0ff"/><stop offset="1" stop-color="#1f6feb"/></linearGradient></defs>
<style>
.fade{animation:fade .9s ease both}
@keyframes fade{from{opacity:0}}
.blink{animation:blink 1.1s steps(2,start) infinite}
@keyframes blink{50%{opacity:0}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.2s ease-out infinite}
@keyframes ping{0%{transform:scale(.55);opacity:.8}100%{transform:scale(1.7);opacity:0}}
.draw{stroke-dasharray:700;animation:draw 2.4s ease both .3s}
@keyframes draw{from{stroke-dashoffset:700}to{stroke-dashoffset:0}}
.grow{transform-box:fill-box;transform-origin:left;animation:grow 1.4s ease both .4s}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
</style>
<text x="440" y="62" font-size="40" fill="#0d1117" font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="650" text-anchor="middle" letter-spacing="-1" class="fade">Joyanta J. Mondal</text>
<rect class="grow" x="370" y="81" width="140" height="2" fill="url(#acc)"/>
<text x="440" y="111" font-size="13" fill="#57606a" text-anchor="middle" class="fade">M. S. in Computer Science - University of Delaware - 2025</text>
<text x="440" y="143" font-size="13" fill="#57606a" text-anchor="middle" letter-spacing="1" class="fade">@lepotatoguy</text>
</svg>
