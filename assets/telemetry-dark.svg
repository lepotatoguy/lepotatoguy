.flame-core{transform-box:fill-box;transform-origin:50% 100%;animation:ember 1.5s ease-in-out infinite}
@keyframes ember{0%,100%{opacity:.75;transform:scale(.9)}45%{opacity:1;transform:scale(1.08)}}
</style>
