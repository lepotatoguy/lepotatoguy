<defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#58a6ff" stop-opacity="0.4"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></linearGradient></defs>
<style>
