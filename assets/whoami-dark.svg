<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 184" width="880" height="184" font-family="ui-monospace,'SFMono-Regular','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace">
<defs><linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#79c0ff"/><stop offset="1" stop-color="#1f6feb"/></linearGradient></defs>
<style>
.fade{animation:fade .9s ease both}
@keyframes fade{from{opacity:0}}
.blink{animation:blink 1.1s steps(2,start) infinite}
@keyframes blink{50%{opacity:0}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.2s ease-out infinite}
@keyframes ping{0%{transform:scale(.55);opacity:.8}100%{transform:scale(1.7);opacity:0}}
.draw{stroke-dasharray:700;animation:draw 2.4s ease both .3s}
@keyframes draw{from{stroke-dashoffset:700}to{stroke-dashoffset:0}}
.grow{transform-box:fill-box;transform-origin:left;animation:grow 1.4s ease both .4s}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
</style>
<text x="10" y="26" font-size="12" fill="#58a6ff" font-weight="600" text-anchor="start" letter-spacing="3" class="fade">01: whoami</text><line x1="129.2" y1="21" x2="870" y2="21" stroke="#30363d" stroke-width="1"/>
<text x="30" y="78" font-size="14" fill="#58a6ff" font-weight="400" text-anchor="start">$</text>
<text x="52" y="78" font-size="14" fill="#e6edf3" font-weight="600" text-anchor="start">whoami</text>
<text x="30" y="107" font-size="14" fill="#e6edf3" text-anchor="start">I&#x27;m Joy, a researcher working on efficient AI and computer vision.</text>
<text x="30" y="133" font-size="14" fill="#8b949e" text-anchor="start">I build AI models with a focus on deployment under limited compute.</text>
<text x="30" y="168" font-size="14" fill="#8b949e" text-anchor="start">I also explore trustworthy AI.</text>
</svg>
