name: telemetry

# Refreshes telemetry, languages, contribution charts and research focus daily.

on:
  schedule:
    - cron: "17 6 * * *" # daily ~06:17 UTC
  workflow_dispatch:
    inputs:
      footer_only:
        description: Refresh only the research footer
        type: boolean
        default: false # manual "Run workflow" button
  push:
    branches: [master, main]
    paths:
      - ".github/profile.json"
      - ".github/scripts/gen-telemetry.mjs"
      - ".github/scripts/gen-languages.mjs"
      - ".github/scripts/research-status.mjs"
      - ".github/scripts/commit-summary.mjs"
      - ".github/scripts/repository-count.mjs"
      - ".github/workflows/telemetry.yml"

permissions:
  contents: write

concurrency:
  group: telemetry
  cancel-in-progress: false

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: regenerate svgs
        env:
          FOOTER_ONLY: ${{ inputs.footer_only }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESEARCH_STATUS_TOKEN: ${{ secrets.RESEARCH_STATUS_TOKEN }}
          RESEARCH_STATUS_REPOS: ${{ secrets.RESEARCH_STATUS_REPOS }}
        run: |
          if [ "$FOOTER_ONLY" = "true" ]; then
            node .github/scripts/gen-telemetry.mjs --footer-only
          else
            node .github/scripts/gen-telemetry.mjs
          fi
      - name: install original language card renderer
        if: ${{ !inputs.footer_only }}
        run: npm install --prefix "$RUNNER_TEMP/joy-language-card" --no-save --ignore-scripts --no-package-lock @stats-organization/github-readme-stats-core@2.2.0
      - name: regenerate language cards
        if: ${{ !inputs.footer_only }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LANGUAGE_STATS_TOKEN: ${{ secrets.LANGUAGE_STATS_TOKEN }}
          LANGUAGE_CARD_ROOT: ${{ runner.temp }}/joy-language-card/node_modules/@stats-organization/github-readme-stats-core
        run: |
          if [ -n "$LANGUAGE_STATS_TOKEN" ]; then
            node .github/scripts/gen-languages.mjs
          else
            echo "::warning::LANGUAGE_STATS_TOKEN missing: existing private-language cards preserved"
          fi
      - name: commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Include newly generated panels when checking for changes.
          if [ -z "$(git status --porcelain -- assets)" ]; then
            echo "no telemetry changes"
          else
            git add assets/telemetry-*.svg assets/activity-*.svg assets/footer-*.svg assets/ecosystem-*.svg assets/languages-*.svg
            git commit -m "chore: refresh telemetry [skip ci]"
            git push
          fi
